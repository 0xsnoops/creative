# DIVERGE blind-spot experiment configuration.
# Model slugs were chosen from OpenRouter's /models endpoint (fetched 2026-10-18).

budget_usd: 28.0            # hard cap on estimated total spend (all cached responses count):
                            # $8.14 spent before the overlooked-ideas phase + its $20 budget

models:
  samplers:                 # one current model per lab
    - anthropic/claude-sonnet-5.5
    - openai/gpt-6.1-sol
    - google/gemini-4-argon
    - meta-llama/llama-4-maverick
    - deepseek/deepseek-v4-pro-0813
  labeler: anthropic/claude-opus-5.5
  implementer: google/gemini-4-argon   # must accept temperature, for the "hot" operator
  extractor: anthropic/claude-haiku-5.5  # cheap reader of consensus code (overlook audit); never generates solutions

sampling:
  n_per_model: 5            # plumbing check; then 20, then 100
  temperature: 1.0
  max_tokens: 16000         # clipped to each model's own limit; includes reasoning tokens
  concurrency: 8

literature:
  n_queries: 8              # labeler-written Exa queries
  n_pre_2022: 3             # the first few are re-run limited to work published before 2022
  results_per_query: 8

labeling:
  batch_size: 8             # samples per labeler call

reality_check:
  k: 3                      # implementations per family
  min_samples_per_model: 20 # below this the CLI skips the reality check; MCP flags low_confidence
  max_tokens: 16000

bench:
  budget_usd_per_operator: 0.5  # every operator gets the same budget per repeat
  repeats: 3                    # each repeat uses a different seed (separate cache keys)
  max_candidates: 12            # per operator per repeat (docs/PREREGISTRATION.md)
  # The preregistered cache_eviction set. hot, verbalized and transplant still exist and run with
  # --operators, but are not in the Phase 2 benchmark (see docs/PREREGISTRATION.md).
  operators: [plain, adhd_frames, blind_spot, blind_spot_contrast, blind_spot_contrast_random,
              blind_spot_feedback, blind_spot_feedback_sham, literature_all, literature_random]
  hot_temperatures: [2.0, 1.6, 1.3]  # tried highest first; falls back to 1.0
  hot_calibration_samples: 2         # a temperature passes if at least half are valid code
  transplant_fields: [biology, logistics, markets, physics, networking]

blind_spot_max_share: 0.02

exa:
  cost_per_search_usd: 0.01 # estimate, used for budget tracking

paths:
  cache: cache
  results: results
